name: Publish docs via GitHub Pages

# Builds the MkDocs site from the markdown in docs/ and publishes it to the
# gh-pages branch, which is what GitHub Pages serves for server.sasjs.io.
#
# The toolchain is pinned in requirements.txt and installed by this job, so the
# versions that render the site are reviewable in the repository rather than
# baked into a Docker image. The build is the same `mkdocs build --strict` the
# pull-request workflow runs, so a broken page link cannot reach the deploy.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the docs toolchain
        run: pip install -r requirements.txt

      - name: Build the site
        # --strict fails the run on a broken page link or anchor, so a dead link
        # cannot be deployed.
        run: mkdocs build --strict

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: server.sasjs.io
